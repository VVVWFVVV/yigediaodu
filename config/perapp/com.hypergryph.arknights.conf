# ============================================================
# 明日方舟 per-app 配置
# 包名：com.hypergryph.arknights
# 引擎：Unity（2D 塔防，60fps 上限，GPU 负载极低）
# 策略：game 档的全核+绑核防技能动画抖动，但频率从轻省电——
#       技能释放时 governor 自然升频，静止时不下限高
# ============================================================

# 套用游戏档
mode=game

# ---- CPU 频率（轻量）----
# 中核 960000（960MHz）：2D 渲染中核足够
cpu.min_freq.p0=960000
# 大核 1209600（1210MHz）：UnityMain 绑大核但负载低，低下限省电
cpu.min_freq.p1=1209600

# ---- GPU ----
# 0 = 不干预（2D 游戏 GPU 需求极低，无需频率下限）
gpu.min_freq=0

# ---- cpuset ----
cpuset.top_app_cpus=0-7

# ---- IO / 内存 ----
io.read_ahead_kb=192
mem.swappiness=20
# 2D 游戏体积小，无需启动缓存释放
mem.drop_caches=0

# ---- 稳帧阶梯（温和，60fps 游戏）----
fps.steps.p0=384000,960000,1363200
fps.steps.p1=1017600,1209600,1401600

# ---- 帧感知调度（v1.0.17 fas-rs）----
# 2D 游戏负载轻，帧感知接管后按需调频更省电
fas.enable=1
fas.target_fps=60
fps.target_fps=60  # v1.1.0 帧探针目标帧率（与 fas 同值）

# ---- 绑核（Unity 线程名）----
# 不绑 RenderThread：2D 游戏渲染与逻辑混合在少数线程，过度绑核反而限制调度器
thread.bind.UnityMain=6-7
thread.bind.UnityChoreograp=0-5
thread.bind.Worker=0-5
thread.bind.TaskGraph=0-5
