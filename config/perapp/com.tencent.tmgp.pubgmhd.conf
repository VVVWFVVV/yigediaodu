# ============================================================
# 和平精英（高清）per-app 配置
# 包名：com.tencent.tmgp.pubgmhd
# 引擎：Unreal Engine 4（PUBG Mobile）
# 帧率档位：60/90/120/144/165 fps
#
# 配置格式：key=value，# 为注释
# mode 决定档位族；其余键覆盖档位同名参数（每应用独立调优）
# ============================================================

# 套用游戏档
mode=game

# ---- CPU 频率 ----
# 中核（policy0, cpu0-5）：1152000（1152 MHz）合法值。
# v1.0.16 曾抬到 1363200 但实测功耗 +17%——帧率稳定性由 governor + 绑核
# 保障，不需要高下限；回退到 1152000
cpu.min_freq.p0=1152000
# 大核（policy6, cpu6-7）：渲染线程不降频，减少掉帧
# 1958400（1958 MHz）是 policy6 合法频率值（1708800 不在频率表中会被钳位）
cpu.min_freq.p1=1958400

# ---- GPU 频率下限（v1.0.16）----
# 389000000（389MHz，Hz 单位）：144fps 需要 GPU 稳定供给，抹掉深 dip 防帧时间尖峰
# （真机 GPU 频率表：160/222/342/389/443/525/607/660/734/832/900/967/1050/1100 MHz）
gpu.min_freq=389000000

# ---- cpuset ----
# 前台可用全部核心，避免被限制到小核簇
cpuset.top_app_cpus=0-7

# ---- IO / 内存 ----
# 增大预读缓冲区，加快地图/资源/贴图加载
io.read_ahead_kb=256
# 降低 swap 倾向，减少内存回收导致的卡顿
mem.swappiness=20

# ---- 帧感知调度（v1.0.17 fas-rs）----
# 默认关闭：eBPF 版虽无 hook 检测风险，但 PUBG 反作弊体系复杂，保守默认。
# 想试帧感知调频：改成 fas.enable=1（保存后即时热重载生效）
fas.enable=0
fas.target_fps=144
fps.target_fps=144  # v1.1.0 帧探针目标帧率（与 fas 同值）

# ---- 绑核（UE4 线程名，前缀匹配）----
# 渲染主线程上大核：保证帧率稳定
thread.bind.RenderThread=6-7
# RHI 线程上大核：UE4 渲染硬件接口，与渲染线程协同
thread.bind.RHIThread=6-7
# 游戏逻辑线程留中核：避免抢占渲染线程的大核时间片
thread.bind.GameThread=0-5
# 线程池留中核：后台任务不干扰前台渲染
thread.bind.PoolThread=0-5
# 任务图线程留中核。
# TaskGraph 前缀覆盖 UE4 全部变体（真机实测线程名是 TaskGraphNP 0，
# 旧前缀 TaskGraphThread 匹配不到它——v1.0.12 CSV 显示其 cpus=0-7 未绑）
thread.bind.TaskGraph=0-5
# 音频线程留中核（v1.0.16）：不占大核时间片
thread.bind.AudioThread=0-5
# 异步资源加载线程留中核（v1.0.16）：落地/跳伞/切图时
# 资源加载不与渲染线程抢大核
thread.bind.AsyncLoading=0-5
