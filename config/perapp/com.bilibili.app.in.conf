# ============================================================
# 哔哩哔哩（手机版）per-app 配置
# 包名：com.bilibili.app.in
# 类型：视频应用（信息流滑动 + 视频播放，解码走硬件）
# ============================================================

# 套用日用增强档：视频应用不需要游戏级干预，
# 增强档的轻抬频率保证信息流滑动/播放流畅
mode=daily-plus

# ---- IO ----
# 本地缓存视频顺序读，大预读减少播放卡顿
io.read_ahead_kb=256
