# ============================================================
# 金铲铲之战 per-app 配置
# 包名：com.tencent.jkchess
# 引擎：Unity（自走棋，3D 棋盘/技能特效，整体负载低）
#
# 策略：套用游戏档，但 CPU 下限从轻——自走棋不是持续高帧渲染，
#       靠 governor 应对技能/团战瞬时负载；GPU 保留 342MHz 下限，
#       抹掉深 dip 防技能特效帧时间尖峰。
# ============================================================

# 套用游戏档
mode=game

# ---- CPU 频率（轻量）----
# 中核 960000（960MHz）：自走棋逻辑/UI 为主，中核足够
cpu.min_freq.p0=960000
# 大核 1209600（1210MHz）：Unity 主/渲染线程不降到底，减少切场景掉帧
cpu.min_freq.p1=1209600

# ---- GPU 频率下限 ----
# 342000000（342MHz）：3D 棋盘/技能特效不需要高 GPU 下限，
# 但保住 342MHz 抹掉 160MHz 深 dip 造成的帧时间尖峰
gpu.min_freq=342000000

# ---- cpuset ----
# 前台可用全部核心，避免被压到小核
cpuset.top_app_cpus=0-7

# ---- IO / 内存 ----
io.read_ahead_kb=192
mem.swappiness=20
# 自走棋资源加载不频繁，不主动 drop_caches
mem.drop_caches=0

# ---- 绑核（Unity 线程名，前缀匹配）----
# 渲染线程上大核；主线程/逻辑/任务图留中核，避免抢占渲染核
thread.bind.UnityGfx=6-7
thread.bind.RenderThread=6-7
thread.bind.UnityMain=0-5
thread.bind.UnityChoreograp=0-5
thread.bind.Worker=0-5
thread.bind.TaskGraph=0-5

# ---- 稳帧阶梯（温和，60fps）----
# 档 0 不干预；档 1 中核 960MHz / 大核 1210MHz；档 2 中核 1363MHz / 大核 1401MHz
fps.steps.p0=384000,960000,1363200
fps.steps.p1=1017600,1209600,1401600

# ---- 帧监控探针 ----
fps.target_fps=60
# 自走棋切场景/技能特效多，卡顿阈值放宽到 8%，避免转场误升档
fps.jank_threshold=8
fps.hold_ms=5000
fps.enable=1
