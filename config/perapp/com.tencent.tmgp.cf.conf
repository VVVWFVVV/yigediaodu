# ============================================================
# 穿越火线（枪战王者，CF Mobile）per-app 配置
# 包名：com.tencent.tmgp.cf
# 引擎：Unity（FPS，120Hz 模式）
# 特点：FPS 命中判定/输入处理在中核，帧时间一致性 > 峰值帧率
# ============================================================

# 套用游戏档
mode=game

# ---- CPU 频率 ----
# 中核下限 1363200（1363MHz）：团战交火频繁，帧时间一致性优先
cpu.min_freq.p0=1363200
# 大核下限 1958400（1958MHz）：渲染线程不降频
cpu.min_freq.p1=1958400

# ---- GPU 频率下限 ----
# 342000000（342MHz，Hz 单位）：抹掉 GPU 深 dip 防帧时间尖峰
gpu.min_freq=342000000

# ---- cpuset ----
cpuset.top_app_cpus=0-7

# ---- IO / 内存 ----
io.read_ahead_kb=256
mem.swappiness=20

# ---- 稳帧阶梯（每游戏独立，v1.0.16）----
# 120Hz FPS 激进阶梯：三档全上，顶到 2246MHz
fps.steps.p0=384000,1363200,1785600
fps.steps.p1=1017600,1689600,2246400

# ---- 帧感知调度（v1.0.17 fas-rs）----
# FPS 的帧时间一致性优先，帧感知预调比反应式阶梯更适合
fas.enable=1
fas.target_fps=120

# ---- 绑核（Unity 线程名，前缀匹配）----
# TaskGraph 宽前缀同时覆盖 Unity/UE4 命名（TaskGraphNP/TaskGraphThread）
thread.bind.RenderThread=6-7
thread.bind.UnityMain=6-7
thread.bind.UnityChoreograp=0-5
thread.bind.Worker=0-5
thread.bind.TaskGraph=0-5
