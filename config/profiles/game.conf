# ============================================================
# 游戏档：前台加速 + 稳帧 + 绑核
# 由命中游戏集合的前台应用自动套用
# ============================================================
family=game

# CPU：抬高大小核最低频，保证前台算力
# 频率值必须是策略组 scaling_available_frequencies 中的合法值——
# 1708800 不在真机频率表中（policy6 合法相邻值 1689→1958 MHz），
# 内核钳位导致写后回读不一致（v1.0.12 实测降级）。
# 引擎另有 snap_to_available_freq 自动向上吸附兜底，此处直接用合法值。
# 真机频率表（2026-10-22 用户提供）：
#   policy0: 384/556/748/960/1152/1363/1555/1785/1996/2227/2400/2745/2918/3072/3321/3532 MHz
#   policy6: 1017/1209/1401/1689/1958/2246/2438/2649/2841/3072/3283/3513/3801/4089/4204/4320 MHz
cpu.min_freq.p0=1152000
cpu.min_freq.p1=1958400

# cpuset：前台应用可用全部核心
cpuset.top_app_cpus=0-7

# GPU 频率下限（v1.0.16）：抹掉深 dip 防帧时间尖峰
# 342000000（342MHz，Hz 单位）是 GPU 频率表合法值；引擎写前自动吸附到最近合法值
gpu.min_freq=342000000

# IO / 内存
io.read_ahead_kb=192
mem.swappiness=20
# 脏页写回阈值适度调大（v1.0.16 ADB 实测 dirty_ratio=60 功耗 +17%，
# 回退到 40/20——保留突发写入收益但不过度增加内存带宽功耗）
mem.dirty_ratio=40
mem.dirty_background_ratio=20
# 游戏启动前释放页缓存（默认关——v1.0.16 实测每次 drop_caches 增加 IO 功耗；
# 需要的 per-app 单独开 mem.drop_caches=1）
mem.drop_caches=0

# 绑核白名单：线程名（前缀匹配）-> 绑定核
# 渲染主线程上大核，编译/加载类线程留中核。
# TaskGraph 前缀覆盖 UE4 全部变体：TaskGraphNP（和平精英实测线程名）、
# TaskGraphThread、TaskGraphWorker 等——旧前缀 TaskGraphThread 匹配不到
# TaskGraphNP，导致绑核缺失（v1.0.12 实测）。
thread.bind.RenderThread=6-7
thread.bind.__render__=6-7
thread.bind.UnityMain=6-7
thread.bind.UnityChoreograp=0-5
thread.bind.Worker=0-5
thread.bind.TaskGraph=0-5
