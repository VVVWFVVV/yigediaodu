# ============================================================
# 日用增强档：轻抬前台最低频抗卡顿
# 适合觉得日常滑动/打开APP有轻微卡顿时使用
# ============================================================
family=daily-plus

# 后台 cpuset 收紧（小核簇）
cpuset.background_cpus=0-3

# 轻抬最低频（只抬一档，不过分）
# 值必须是真机频率表合法值（556800=556MHz 在 policy0 表、1017600=1017MHz 是 policy6 最低档）
cpu.min_freq.p0=556800
cpu.min_freq.p1=1017600

# IO 轻调
io.read_ahead_kb=128

# 内存轻调
mem.swappiness=40
