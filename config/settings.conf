# ============================================================
# 一个调度 · 全局设置（行式 key=value，# 为注释）
# ============================================================

# 总开关：0 = 完全不干预（守护待命，节点保持系统默认）
enabled=1

# 轮询：常规周期 / 连续无切换时的退避周期（毫秒）
poll_interval_ms=1000
poll_idle_ms=2000

# 切换去抖：同一目标连续命中这么多次才算切换（防抖）
switch_debounce=2
# 切换冷却：一次切换后多久内不再切换（毫秒）
switch_cooldown_ms=800

# 默认族：未配置应用的亮屏档位（daily = 保守省电，不碰前台频率）
default_family=daily

# live 快照推送周期（毫秒）：WebUI 看板数据落盘间隔
live_push_ms=5000

# ---------------- 能力开关（1=开 / 0=关） ----------------
feature.cpu=1
feature.cpuset=1
feature.threads=1
feature.gpu=1
feature.io=1
feature.mem=1
feature.thermal=1

# ---------------- 稳帧 ----------------
fps.enable=1
fps.sample_ms=2000
# 卡顿率阈值（百分比）：超过则升一档
fps.jank_threshold=5
# 阶梯保持窗口（毫秒）：升档后至少保持这么久才允许降档（滞回防震荡）
fps.hold_ms=5000
# 各策略组的最低频阶梯（逗号分隔，档0=不干预）；
# 档位按策略组顺序对应 detect_policies 的结果（p0=中核簇，p1=大核簇）
# 频率值必须是合法可用频率（scaling_available_frequencies 中的值），
# 否则内核钳位导致写后回读不一致（v1.0.12 实测）；引擎另有自动吸附兜底。
# 真机频率表（2026-10-22 提供）：policy0 含 384/1152/1785 MHz，
# policy6 含 1017/1401/1958 MHz
fps.steps.p0=384000,1152000,1785600
fps.steps.p1=1017600,1401600,1958400

# ---- 帧监控探针（v1.1.0：adreno uprobe 实时 FPS）----
# 路线：tracefs uprobe 挂 /vendor/lib64/libEGL_adreno.so 的 eglSwapBuffers，
# 每秒读 uprobe_profile 计数差分 = 实时帧率；掉帧时升档从快（连续 2 次确认），
# 降档要求卡顿率与帧率双健康。此内核 perf-uprobe+BPF 路线已阉割、动态事件
# 不进缓冲——计数差分是唯一可用帧信号（无每帧时间戳，卡顿定位仍靠 gfxinfo）。
# OTA 后若符号偏移失效，探针 5 秒自校验自动停用回退卡顿率阶梯。
fps.frame_probe=1
fps.target_fps=60
fps.low_ratio=90
frame.lib_path=/vendor/lib64/libEGL_adreno.so
frame.symbol_off=0x9ed0

# ---------------- 温控联动（只封顶、不停服务） ----------------
thermal.enable=1
# 超过 cap_temp 毫度则封顶频率；低于 recover_temp 毫度解除（滞回）
thermal.cap_temp=48000
thermal.recover_temp=44000
# 封顶时各策略组的频率上限（毫度超限时写入）
# 值必须是合法可用频率（2600000 不在 policy6 频率表，会写后回读不一致）
thermal.cap.p0=2400000
thermal.cap.p1=2649600
